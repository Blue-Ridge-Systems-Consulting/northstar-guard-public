name: macOS build

on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"
  push:
    branches:
      - main
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Intel dashboard launcher
        run: |
          clang -arch x86_64 -mmacosx-version-min=12.0 \
            -fobjc-arc -O2 -Wall -Wextra -framework AppKit \
            macos/Tools/dashboard_launcher.m \
            -o "$RUNNER_TEMP/NorthstarGuardLauncher-x86_64"
          test "$(lipo -archs "$RUNNER_TEMP/NorthstarGuardLauncher-x86_64")" = "x86_64"
      - name: Build Apple Silicon package
        run: |
          ./macos/apple-silicon/build.sh
          test "$(lipo -archs macos/apple-silicon/bin/northstar-guard)" = "arm64"
          test "$(lipo -archs macos/apple-silicon/bin/NorthstarGuardLauncher)" = "arm64"
